version: '3.8'

services:
  collabcraft-web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_WS_ENDPOINT=ws://localhost:1234
    depends_on:
      - collabcraft-relay

  collabcraft-relay:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npm", "run", "server"]
    ports:
      - "1234:1234"
    environment:
      - PORT=1234
      - HOST=0.0.0.0
